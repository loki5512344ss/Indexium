services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indexium
      POSTGRES_USER: indexium
      POSTGRES_PASSWORD: indexium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexium -d indexium"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./indexium-backend
    environment:
      DATABASE_URL: postgres://indexium:indexium@postgres:5432/indexium
      SERVER_PORT: "8080"
      RUST_LOG: info
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./indexium-frontend
    environment:
      PUBLIC_API_URL: http://localhost:8080
      VITE_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
